- switch:
    - <<: &switch_eclairage_piece
        icon: mdi:lightbulb-group
        state: >
          {% set entity_id = this.entity_id | default('', true) %}
          {% set area_id = entity_id | replace('switch.eclairage_', '') %}
          {% set piece = '' if area_id == 'maison' else area_id %}
          {% set entities = expand(area_entities(piece)) if piece else states %}
          {% set ns = namespace(on=false) %}
          {% for s in entities %}
            {% if s.state == 'on' and 'light' in labels(s.entity_id) %}
              {% set ns.on = true %}
            {% endif %}
          {% endfor %}
          {{ ns.on }}
        turn_on:
          - variables:
              light_entities: >
                {% set entity_id = this.entity_id | default('', true) %}
                {% set area_id = entity_id | replace('switch.eclairage_', '') %}
                {% set piece = '' if area_id == 'maison' else area_id %}
                {% set entities = expand(area_entities(piece)) if piece else states %}
                {% set ns = namespace(ids=[]) %}
                {% for s in entities %}
                  {% if 'light' in labels(s.entity_id) %}
                    {% set ns.ids = ns.ids + [s.entity_id] %}
                  {% endif %}
                {% endfor %}
                {{ ns.ids | join(',') }}
          - condition: template
            value_template: "{{ light_entities | length > 0 }}"
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ light_entities }}"
        turn_off:
          - variables:
              light_entities: >
                {% set entity_id = this.entity_id | default('', true) %}
                {% set area_id = entity_id | replace('switch.eclairage_', '') %}
                {% set piece = '' if area_id == 'maison' else area_id %}
                {% set entities = expand(area_entities(piece)) if piece else states %}
                {% set ns = namespace(ids=[]) %}
                {% for s in entities %}
                  {% if 'light' in labels(s.entity_id) %}
                    {% set ns.ids = ns.ids + [s.entity_id] %}
                  {% endif %}
                {% endfor %}
                {{ ns.ids | join(',') }}
          - condition: template
            value_template: "{{ light_entities | length > 0 }}"
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ light_entities }}"
      name: "Éclairage Aire commune"
      unique_id: switch_eclairage_aire_commune
      default_entity_id: switch.eclairage_aire_commune

