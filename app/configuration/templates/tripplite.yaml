- sensor:
    - name: "Tripp Lite UPS Battery Level"
      unique_id: tripp_lite_ups_battery_level
      state: >-
        {{ states("sensor.tripp_lite_ups_battery_charge") | int(0) }}
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      availability: >-
        {{ states("sensor.tripp_lite_ups_battery_charge") | is_number }}
      icon: >-
        {%- set pct = states("sensor.tripp_lite_ups_battery_charge") | int(0) -%}
        {%- set charge_state = states("sensor.tripp_lite_ups_charge_state") -%}
        {%- set power_source = states("sensor.tripp_lite_ups_power_source") -%}
        {%- set plugged_sources = ["ac_input", "bypass", "boosting", "reducing", "economy"] -%}
        {%- set level = 100 if pct >= 95 else 90 if pct >= 90 else 80 if pct >= 80 else 70 if pct >= 70 else 60 if pct >= 60 else 50 if pct >= 50 else 40 if pct >= 40 else 30 if pct >= 30 else 20 if pct >= 20 else 10 if pct >= 10 else 0 -%}
        {%- if charge_state == "charging" -%}
          {%- if level == 100 -%}mdi:battery-charging-100
          {%- elif level == 90 -%}mdi:battery-charging-90
          {%- elif level == 80 -%}mdi:battery-charging-80
          {%- elif level == 70 -%}mdi:battery-charging-70
          {%- elif level == 60 -%}mdi:battery-charging-60
          {%- elif level == 50 -%}mdi:battery-charging-50
          {%- elif level == 40 -%}mdi:battery-charging-40
          {%- elif level == 30 -%}mdi:battery-charging-30
          {%- elif level == 20 -%}mdi:battery-charging-20
          {%- elif level == 10 -%}mdi:battery-charging-10
          {%- else -%}mdi:battery-charging-outline
          {%- endif -%}
        {%- elif charge_state == "discharging" or power_source == "battery" -%}
          {%- if pct <= 20 -%}mdi:battery-alert
          {%- else -%}mdi:battery-alert-variant-outline
          {%- endif -%}
        {%- elif power_source in plugged_sources -%}
          mdi:power-plug-battery
        {%- elif level == 100 -%}mdi:battery
        {%- elif level == 90 -%}mdi:battery-90
        {%- elif level == 80 -%}mdi:battery-80
        {%- elif level == 70 -%}mdi:battery-70
        {%- elif level == 60 -%}mdi:battery-60
        {%- elif level == 50 -%}mdi:battery-50
        {%- elif level == 40 -%}mdi:battery-40
        {%- elif level == 30 -%}mdi:battery-30
        {%- elif level == 20 -%}mdi:battery-20
        {%- elif level == 10 -%}mdi:battery-10
        {%- else -%}mdi:battery-outline
        {%- endif -%}
      attributes:
        icon_color: >-
          {%- set pct = states("sensor.tripp_lite_ups_battery_charge") | int(0) -%}
          {%- if pct > 60 -%}var(--success-color)
          {%- elif pct > 20 -%}var(--warning-color)
          {%- else -%}var(--error-color)
          {%- endif -%}
        entity_color: >-
          {%- set pct = states("sensor.tripp_lite_ups_battery_charge") | int(0) -%}
          {%- if pct > 60 -%}var(--success-color)
          {%- elif pct > 20 -%}var(--warning-color)
          {%- else -%}var(--error-color)
          {%- endif -%}
        level_color: >-
          {%- set pct = states("sensor.tripp_lite_ups_battery_charge") | int(0) -%}
          {%- if pct > 60 -%}green
          {%- elif pct > 20 -%}yellow
          {%- else -%}red
          {%- endif -%}
        battery_mode: >-
          {%- set charge_state = states("sensor.tripp_lite_ups_charge_state") -%}
          {%- set power_source = states("sensor.tripp_lite_ups_power_source") -%}
          {%- set plugged_sources = ["ac_input", "bypass", "boosting", "reducing", "economy"] -%}
          {%- if charge_state == "charging" -%}charging
          {%- elif charge_state == "discharging" or power_source == "battery" -%}discharging
          {%- elif power_source in plugged_sources -%}plugged
          {%- else -%}{{ charge_state }}
          {%- endif -%}
        runtime_minutes: >-
          {%- set runtime = states("sensor.tripp_lite_ups_runtime_remaining") -%}
          {%- if runtime | is_number -%}{{ runtime | int(0) }}{%- else -%}unknown{%- endif -%}
        runtime_label: >-
          {%- set runtime = states("sensor.tripp_lite_ups_runtime_remaining") -%}
          {%- if runtime | is_number -%}{{ runtime | int(0) }} min{%- else -%}unknown{%- endif -%}
        battery_summary: >-
          {%- set pct = states("sensor.tripp_lite_ups_battery_charge") | int(0) -%}
          {%- set runtime = states("sensor.tripp_lite_ups_runtime_remaining") -%}
          {%- if runtime | is_number -%}{{ pct }} % · {{ runtime | int(0) }} min{%- else -%}{{ pct }} %{%- endif -%}
        status_summary: >-
          {%- set runtime = states("sensor.tripp_lite_ups_runtime_remaining") -%}
          {%- set charge_state = states("sensor.tripp_lite_ups_charge_state") -%}
          {%- set power_source = states("sensor.tripp_lite_ups_power_source") -%}
          {%- set plugged_sources = ["ac_input", "bypass", "boosting", "reducing", "economy"] -%}
          {%- if charge_state == "charging" -%}
            {%- set mode = "charging" -%}
          {%- elif charge_state == "discharging" or power_source == "battery" -%}
            {%- set mode = "discharging" -%}
          {%- elif power_source in plugged_sources -%}
            {%- set mode = "plugged" -%}
          {%- else -%}
            {%- set mode = charge_state -%}
          {%- endif -%}
          {%- if runtime | is_number -%}{{ runtime | int(0) }} min · {{ mode }}{%- else -%}{{ mode }}{%- endif -%}
        charge_state: >-
          {{ states("sensor.tripp_lite_ups_charge_state") }}
        power_source: >-
          {{ states("sensor.tripp_lite_ups_power_source") }}
