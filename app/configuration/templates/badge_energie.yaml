- sensor:
    - <<: &badge_energie_piece
        icon: mdi:power-plug
        device_class: power
        state_class: measurement
        unit_of_measurement: "W"
        state: >
          {% set piece = this.attributes.get('area_id', '') %}
          {% set ns = namespace(total=0) %}
          {% for entity_id in area_entities(piece) %}
            {% set s = states[entity_id] %}
            {% if s is not none
              and s.domain == 'sensor'
              and s.attributes.device_class == 'power'
              and s.state not in ['unknown', 'unavailable'] %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ns.total | round(0) }}
      name: "Puissance Aire commune"
      unique_id: puissance_aire_commune
      attributes:
        area_id: aire_commune
    - <<: *badge_energie_piece
      name: "Puissance Bureau"
      unique_id: puissance_bureau
      attributes:
        area_id: bureau
