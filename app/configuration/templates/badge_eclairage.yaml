- sensor:
    - <<: &badge_eclairage_piece
        icon: mdi:lightbulb-on
        state_class: measurement
        state: >
          {% set piece = this.attributes.get('area_id', '') %}
          {% set entities = expand(area_entities(piece)) if piece else states %}
          {% set ns = namespace(total=0) %}
          {% for s in entities %}
            {% if s.state == 'on'
              and 'light' in labels(s.entity_id) %}
              {% set ns.total = ns.total + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.total }}
      name: "Éclairage Aire commune"
      unique_id: eclairage_aire_commune
      attributes:
        area_id: aire_commune
    - <<: *badge_eclairage_piece
      name: "Éclairage Bureau"
      unique_id: eclairage_bureau
      attributes:
        area_id: bureau
