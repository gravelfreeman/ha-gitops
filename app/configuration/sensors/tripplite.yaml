- platform: snmp
  name: "Tripp Lite UPS Battery Status"
  unique_id: tripplite_battery_status
  host: 10.0.30.120
  version: "2c"
  community: tripplite
  baseoid: 1.3.6.1.4.1.850.1.1.3.1.3.1.1.1.1.1
  icon: mdi:battery-heart
  accept_errors: true
  value_template: >
    {% if value | int == 1 %}unknown
    {% elif value | int == 2 %}normal
    {% elif value | int == 3 %}battery_low
    {% elif value | int == 4 %}battery_depleted
    {% else %}commfail
    {% endif %}
- platform: snmp
  name: "Tripp Lite UPS Charge State"
  unique_id: tripplite_battery_charge_detail
  host: 10.0.30.120
  version: "2c"
  community: tripplite
  baseoid: 1.3.6.1.4.1.850.1.1.3.1.3.1.2.1.4.1
  icon: mdi:battery-sync
  accept_errors: true
  value_template: >
    {% if value | int == 0 %}float
    {% elif value | int == 1 %}charging
    {% elif value | int == 2 %}resting
    {% elif value | int == 3 %}discharging
    {% elif value | int == 4 %}normal
    {% elif value | int == 5 %}standby
    {% else %}commfail
    {% endif %}
- platform: snmp
  name: "Tripp Lite UPS Power Source"
  unique_id: tripplite_source
  host: 10.0.30.120
  version: "2c"
  community: tripplite
  baseoid: 1.3.6.1.4.1.850.1.1.3.1.3.3.1.1.1.1
  icon: mdi:power-plug-battery
  accept_errors: true
  value_template: >
    {% if value | int == 0 %}unknown
    {% elif value | int == 1 %}other
    {% elif value | int == 2 %}none
    {% elif value | int == 3 %}ac_input
    {% elif value | int == 4 %}bypass
    {% elif value | int == 5 %}battery
    {% elif value | int == 6 %}boosting
    {% elif value | int == 7 %}reducing
    {% elif value | int == 8 %}second
    {% elif value | int == 9 %}economy
    {% else %}commfail
    {% endif %}
- platform: integration
  source: sensor.tripp_lite_ups_output_power
