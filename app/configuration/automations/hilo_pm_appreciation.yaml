- id: '1700761554878'
  alias: Hilo - PM1 (appreciation)
  description: ''
  trigger:
  - platform: state
    entity_id:
    - sensor.defi_hilo
    to: appreciation
  condition:
  - condition: time
    after: '11:30:00'
    before: '13:30:00'
  - condition: template
    value_template: '{{''pm'' in state_attr(''sensor.defi_hilo'',''next_events'')[0][''period'']
      }}'
  action:
  - service: switch.turn_off
    data_template:
      entity_id: "{% set switches = states.switch\n  | selectattr('entity_id', 'match',
        '^switch\\.schedule_.*$')\n  | map(attribute='entity_id') %}\n{{ switches
        | join(',') }}\n"
  - service: climate.set_temperature
    data:
      temperature: 30
    target:
      entity_id:
      - climate.thermostat_chambre
      - climate.thermostat_salle_d_eau
      - climate.thermostat_salle_de_bain
      - climate.thermostat_salon
      - climate.thermostat_sous_sol
  - service: climate.set_hvac_mode
    target:
      entity_id:
      - climate.thermostat_garage
    data:
      hvac_mode: heat
  - service: climate.set_temperature
    target:
      entity_id:
      - climate.thermostat_garage
    data:
      temperature: 35
  - if:
    - condition: state
      entity_id: person.freeman
      state: home
    then:
    - service: climate.set_temperature
      data:
        temperature: 21
      target:
        entity_id: climate.thermostat_bureau
    else:
    - service: climate.set_temperature
      data:
        temperature: 30
      target:
        entity_id: climate.thermostat_bureau
  mode: single
