- id: '1701968718032'
  alias: Hilo - PM3 (pre-heat)
  description: ''
  trigger:
  - platform: time
    at: '16:00:00'
  condition:
  - condition: state
    entity_id: sensor.defi_hilo
    state: pre_heat
  - condition: template
    value_template: '{{''pm'' in state_attr(''sensor.defi_hilo'',''next_events'')[0][''period'']
      }}'
  action:
  - service: climate.set_temperature
    data:
      temperature: 30
    target:
      entity_id:
      - climate.thermostat_chambre
      - climate.thermostat_salle_d_eau
      - climate.thermostat_salle_de_bain
      - climate.thermostat_salon
      - climate.thermostat_sous_sol
  - if:
    - condition: state
      entity_id: person.freeman
      state: home
    then:
    - service: climate.set_temperature
      data:
        temperature: 21
      target:
        entity_id: climate.thermostat_bureau
    else:
    - service: climate.set_temperature
      data:
        temperature: 30
      target:
        entity_id: climate.thermostat_bureau
  mode: single
