- id: '1700760638630'
  alias: Hilo - AM1 (appreciation)
  description: ''
  trigger:
  - platform: state
    entity_id:
    - sensor.defi_hilo
    to: appreciation
  condition:
  - condition: time
    after: 00:45:00
    before: 01:30:00
  - condition: template
    value_template: '{{''am'' in state_attr(''sensor.defi_hilo'',''next_events'')[0][''period'']
      }}'
  action:
  - service: switch.turn_off
    data_template:
      entity_id: "{% set switches = states.switch\n  | selectattr('entity_id', 'match',
        '^switch\\.schedule_.*$')\n  | map(attribute='entity_id') %}\n{{ switches
        | join(',') }}\n"
  - service: climate.set_temperature
    data:
      temperature: 30
    target:
      entity_id:
      - climate.thermostat_salle_d_eau
      - climate.thermostat_salle_de_bain
      - climate.thermostat_salon
  - service: climate.set_temperature
    data:
      temperature: 25
    target:
      entity_id:
      - climate.thermostat_bureau
      - climate.thermostat_sous_sol
  - service: climate.set_temperature
    data:
      temperature: 20
    target:
      entity_id: climate.thermostat_chambre
  - service: climate.set_hvac_mode
    target:
      entity_id:
      - climate.thermostat_garage
    data:
      hvac_mode: heat
  - service: climate.set_temperature
    data:
      temperature: 35
    target:
      entity_id: climate.thermostat_garage
  mode: single
