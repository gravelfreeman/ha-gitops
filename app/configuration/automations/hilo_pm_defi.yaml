- id: '1701969634470'
  alias: Hilo - PM4 (defi)
  description: ''
  trigger:
  - platform: state
    entity_id:
    - sensor.defi_hilo
    to: reduction
  condition:
  - condition: time
    after: '16:45:00'
    before: '17:30:00'
  - condition: template
    value_template: '{{''pm'' in state_attr(''sensor.defi_hilo'',''next_events'')[0][''period'']
      }}'
  action:
  - service: climate.set_temperature
    data:
      temperature: 5
    target:
      entity_id:
      - climate.thermostat_bureau
      - climate.thermostat_chambre
      - climate.thermostat_salle_d_eau
      - climate.thermostat_salle_de_bain
      - climate.thermostat_salon
      - climate.thermostat_sous_sol
      - climate.thermostat_garage
  mode: single
