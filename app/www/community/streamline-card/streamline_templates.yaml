bubble_room_card:
  default:
    name: ''
    icon: mdi:home
    hash: ''
    temperature_entity: ''
    thermostat_entity: ''
    light_sensor_entity: ''
    light_switch_entity: ''
    power_sensor_entity: ''
  card:
    type: custom:bubble-card
    card_type: button
    sub_button:
      main:
      - buttons_layout: inline
        justify_content: center
        group_javascript: "const hash = `#${variables.hash}`;\nconst group = [];\n\
          const lightSensor = variables.light_sensor_entity;\nconst lightSwitch =\
          \ variables.light_switch_entity;\nconst thermostat = variables.thermostat_entity;\n\
          const powerSensor = variables.power_sensor_entity;\n\nif (lightSensor) {\n\
          \  group.push({\n    entity: lightSensor,\n    show_name: false,\n    show_state:\
          \ false,\n    content_layout: \"icon-left\",\n    state_background: true,\n\
          \    show_background: true,\n    scrolling_effect: false,\n    tap_action:\
          \ {\n      action: \"navigate\",\n      navigation_path: hash\n    },\n\
          \    show_icon: true,\n    fill_width: false,\n    hide_when_parent_unavailable:\
          \ false,\n    visibility: [\n      {\n        condition: \"numeric_state\"\
          ,\n        above: 0,\n        entity: lightSensor\n      }\n    ],\n   \
          \ hold_action: lightSwitch\n      ? {\n          action: \"perform-action\"\
          ,\n          perform_action: \"switch.turn_off\",\n          target: {\n\
          \            entity_id: lightSwitch\n          }\n        }\n      : {\n\
          \          action: \"none\"\n        },\n    icon: \"mdi:lightbulb\",\n\
          \    force_icon: true\n  });\n}\n\nif (thermostat) {\n  group.push({\n \
          \   entity: thermostat,\n    show_name: false,\n    show_state: false,\n\
          \    content_layout: \"icon-left\",\n    state_background: true,\n    show_background:\
          \ true,\n    scrolling_effect: false,\n    tap_action: {\n      action:\
          \ \"navigate\",\n      navigation_path: hash\n    },\n    show_icon: true,\n\
          \    fill_width: false,\n    icon: \"mdi:radiator\",\n    force_icon: false,\n\
          \    hide_when_parent_unavailable: false,\n    visibility: [\n      {\n\
          \        condition: \"state\",\n        entity: thermostat,\n        state:\
          \ \"heat\"\n      }\n    ]\n  });\n}\n\nif (powerSensor) {\n  group.push({\n\
          \    entity: powerSensor,\n    show_name: false,\n    show_state: false,\n\
          \    content_layout: \"icon-left\",\n    state_background: true,\n    show_background:\
          \ true,\n    scrolling_effect: false,\n    tap_action: {\n      action:\
          \ \"navigate\",\n      navigation_path: hash\n    },\n    show_icon: true,\n\
          \    fill_width: false,\n    hide_when_parent_unavailable: false,\n    visibility:\
          \ [\n      {\n        condition: \"numeric_state\",\n        above: 0,\n\
          \        entity: powerSensor\n      }\n    ]\n  });\n}\n\nreturn group;\n"
      bottom: []
      main_layout: inline
    button_type: name
    name: '[[name]]'
    icon: '[[icon]]'
    show_attribute: false
    show_last_changed: false
    show_last_updated: false
    show_icon: true
    scrolling_effect: true
    show_name: true
    force_icon: false
    state_color: false
    button_action:
      tap_action:
        action: navigate
        navigation_path: '#[[hash]]'
    tap_action:
      action: none
    entity_javascript: return variables.temperature_entity || "";
    show_state_javascript: return Boolean(variables.temperature_entity);
    styles_javascript: "const baseStyles = `.bubble-button-card-container {\n  background-color:\
      \ var(--bubble-main-background-color, var(--card-background-color)) !important;\n\
      }\n.bubble-icon-container {\n  background-color: var(--bubble-secondary-background-color,\
      \ var(--card-background-color)) !important;\n  color: var(--primary-color) !important;\n\
      \  opacity: 1 !important;\n}\n.bubble-icon {\n  color: var(--primary-color)\
      \ !important;\n}\n`;\n\nconst formatNumber = (value, digits) => {\n  const number\
      \ = Number(value);\n  if (!Number.isFinite(number)) return null;\n  return number.toLocaleString(\"\
      fr-CA\", {\n    minimumFractionDigits: digits,\n    maximumFractionDigits: digits,\n\
      \  });\n};\n\nconst temperatureEntity = variables.temperature_entity;\nif (!temperatureEntity)\
      \ return baseStyles;\n\nconst temperature = formatNumber(states[temperatureEntity]?.state,\
      \ 1);\nif (temperature === null) return baseStyles;\n\nconst parts = [`${temperature}\
      \ °C`];\nconst powerEntity = variables.power_sensor_entity;\nconst powerValue\
      \ = powerEntity ? Number(states[powerEntity]?.state) : NaN;\nif (Number.isFinite(powerValue)\
      \ && powerValue >= 1) {\n  parts.push(`${formatNumber(powerValue, 0)} W`);\n\
      }\n\nconst summary = parts.join(\" • \").replace(/\\\\/g, \"\\\\\\\\\").replace(/\"\
      /g, '\\\\\"');\nreturn `${baseStyles}\n.bubble-state {\n  font-size: 0 !important;\n\
      }\n.bubble-state::before {\n  content: \"${summary}\";\n  font-size: 12px;\n\
      }\n`;\n"
bubble_room_section_chauffage:
  default:
    thermostat_entity: ''
    temperature_entity: ''
    main_thermostat_name: Thermostat
    extra_thermostat_entity: ''
    extra_thermostat_name: Thermostat
  card:
    type: vertical-stack
    cards:
    - type: custom:bubble-card
      card_type: separator
      name: Chauffage
      icon: mdi:fire
      sub_button:
        main: []
        bottom: []
    - type: custom:bubble-card
      card_type: button
      entity: '[[thermostat_entity]]'
      name: '[[main_thermostat_name]]'
      icon: mdi:radiator
      force_icon: false
      show_state: false
      show_last_changed: false
      show_last_updated: false
      state_color: true
      hide_temperature: false
      card_layout: large
      rows: '1'
      button_type: slider
      show_attribute: true
      attribute: temperature
      tap_action:
        action: toggle
      button_action:
        tap_action:
          action: none
      sub_button:
        main:
        - entity: '[[thermostat_entity]]'
          show_state: true
          show_icon: false
          force_icon: false
          state_background: false
          show_background: false
          scrolling_effect: true
          show_name: false
          show_last_changed: true
          show_last_updated: false
          show_attribute: false
          attribute: temperature
          tap_action:
            action: none
        bottom: []
    - type: custom:bubble-card
      card_type: button
      entity: '[[extra_thermostat_entity]]'
      name: '[[extra_thermostat_name]]'
      icon: mdi:radiator
      force_icon: false
      show_state: false
      show_last_changed: false
      show_last_updated: false
      state_color: true
      hide_temperature: false
      card_layout: large
      rows: '1'
      button_type: slider
      show_attribute: true
      attribute: temperature
      tap_action:
        action: toggle
      button_action:
        tap_action:
          action: none
      visibility_javascript: "if (!variables.extra_thermostat_entity) {\n  return\
        \ [\n    {\n      condition: \"state\",\n      entity: variables.thermostat_entity,\n\
        \      state: \"__extra_thermostat_disabled__\"\n    }\n  ];\n}\n\nreturn\
        \ [\n  {\n    condition: \"state\",\n    entity: variables.extra_thermostat_entity,\n\
        \    state_not: \"unavailable\"\n  }\n];\n"
      sub_button:
        main:
        - entity: '[[extra_thermostat_entity]]'
          show_state: true
          show_icon: false
          force_icon: false
          state_background: false
          show_background: false
          scrolling_effect: true
          show_name: false
          show_last_changed: true
          show_last_updated: false
          show_attribute: false
          attribute: temperature
          tap_action:
            action: none
        bottom: []
    - graph: line
      type: sensor
      entity: '[[temperature_entity]]'
      detail: 1
      name:
        type: entity
      grid_options:
        columns: full
        rows: 2
bubble_room_section_automations:
  card:
    type: vertical-stack
    cards:
    - type: custom:bubble-card
      card_type: separator
      name: Automations
      icon: mdi:calendar
      sub_button:
        main: []
        bottom: []
    - type: custom:scheduler-card
      title: false
      display_options:
        secondary_info:
        - relative-time
